# 工作流名称
name: Sync-Images-to-ali-Example
# 工作流运行时显示名称
run-name: ${{ github.actor }} is Sync Images to ali.
# 怎样触发工作流
on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]
 
  # Allows you to run this workflow manually from the Actions tab
  workflow_dispatch:
 
# 工作流程任务
jobs:
  syncimages:
    runs-on: ubuntu-latest
    
    steps:
    - name: Checkout Repos
      uses: actions/checkout@v3
      
    # 初始化并启用官方 Buildx 引擎
    - name: Set up Docker Buildx
      uses: docker/setup-buildx-action@v3
      
    # 登录到阿里云镜像仓库  
    - name: Login to Alibaba Cloud Container Registry  
      env:  
        username: ${{ secrets.DOCKER_USERNAME }}  
        password: ${{ secrets.DOCKER_PASSWORD }}
      run: |  
        echo "$password" | docker login --username="$username" --password-stdin registry.cn-hangzhou.aliyuncs.com
    
    # 使用 Buildx 跨仓库直接中转多架构镜像，并剥离不兼容的 OCI 属性
    - name: Sync and Strip OCI Manifest via Buildx
      run: |
        #!/usr/bin/env bash
        set -e
        
        echo "Starting multi-architecture image sync with OCI filtering..."
        
        docker buildx imagetools create \
          --tag registry.cn-hangzhou.aliyuncs.com/lzq70112/sglang:latest \
          --provenance=false \
          lmsysorg/sglang:latest
          
        echo "Sync completed successfully!"
